<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Billet participant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'Manrope', system-ui, sans-serif; background: #101018; color: #EDEBF5; }
a { color: #A78BFA; } a:hover { color: #C4B5FD; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #101018; display: flex; flex-direction: column;">

  <div style="padding: 26px 24px 0; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #A5A2BC; font-weight: 700;">Association Poly</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 32px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; color: #EDEBF5;">Soirée d'hiver</h1>
    <div style="font-size: 14px; color: #A5A2BC;">Samedi 14 mars · 22h00 · Le Hangar</div>
  </div>

  <div style="flex-grow: 1; padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 14px; justify-content: center;">

    <div style="background: #F7F6FB; border-radius: 24px; padding: 26px 24px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px;">
      <div style="display: grid; grid-template-columns: repeat(29, 1fr); width: 240px; height: 240px;">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="3"><div style="background: {{c.fill}}"></div></sc-for>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 3px;">
        <div style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 23px; font-weight: 700; color: #14131C; letter-spacing: -0.01em;">Camille Moreau</div>
        <div style="font-size: 13px; color: #56536B; letter-spacing: 0.04em;">Billet A7F2 · 49KD</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="background: #1A1A26; border: 1px solid #2B2B3C; border-radius: 16px; padding: 15px 16px; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 32px; line-height: 1; font-weight: 800; color: #EDEBF5;">1</span>
          <span style="font-size: 14px; font-weight: 700; color: #EDEBF5;">entrée</span>
        </div>
        <div style="font-size: 12px; color: #A5A2BC; line-height: 1.35;">Sur ce billet</div>
      </div>
      <div style="background: #1A1A26; border: 1px solid #2B2B3C; border-radius: 16px; padding: 15px 16px; display: flex; flex-direction: column; gap: 4px;">
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 32px; line-height: 1; font-weight: 800; color: #C4B5FD;">3</span>
          <span style="font-size: 14px; font-weight: 700; color: #EDEBF5;">tickets</span>
        </div>
        <div style="font-size: 12px; color: #A5A2BC; line-height: 1.35;">Boisson, remis à l'entrée</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 2px 4px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A5A2BC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v4h1"></path></svg>
      <div style="font-size: 12.5px; color: #A5A2BC; line-height: 1.45;">Valable <strong style="color: #EDEBF5; font-weight: 700;">une seule fois</strong>. Monte la luminosité de ton écran avant de le présenter.</div>
    </div>

  </div>

  <div style="padding: 0 24px 26px;">
    <div style="border-top: 1px solid #22222F; padding-top: 14px; font-size: 12px; color: #6F6C87;">Reçu par email après ton paiement HelloAsso.</div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const N = 29;
    const cells = [];
    let seed = 20260314;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const inBox = (x, y, ox, oy) => x >= ox && x < ox + 7 && y >= oy && y < oy + 7;
    const isFinder = (x, y) => inBox(x, y, 0, 0) || inBox(x, y, N - 7, 0) || inBox(x, y, 0, N - 7);
    const finderOn = (x, y) => {
      const lx = x >= N - 7 ? x - (N - 7) : x;
      const ly = y >= N - 7 ? y - (N - 7) : y;
      const d = Math.max(Math.abs(lx - 3), Math.abs(ly - 3));
      return d === 3 || d <= 1;
    };
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const quiet = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
        let on;
        if (isFinder(x, y)) on = finderOn(x, y);
        else if (quiet) on = false;
        else if (x === 6 || y === 6) on = (x + y) % 2 === 0;
        else on = rnd() > 0.52;
        cells.push({ fill: on ? '#16161F' : 'transparent' });
      }
    }
    return { cells };
  }
}
</script>
</body>
</html>
