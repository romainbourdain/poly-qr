# Stack de production : `docker compose up -d`.
# Variables requises : voir .env.example (fichier `.env` à côté de ce fichier).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: polyqr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: polyqr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polyqr -d polyqr"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/romainbourdain/poly-qr-migrate:${APP_TAG:-latest}
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://polyqr:${POSTGRES_PASSWORD}@db:5432/polyqr
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/romainbourdain/poly-qr:${APP_TAG:-latest}
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://polyqr:${POSTGRES_PASSWORD}@db:5432/polyqr
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
