name: Release

# Push sur `build` : tag <version>-r<N> + image GHCR.
on:
  push:
    branches: [build]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push du tag git
      packages: write # push de l'image GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute tag
        id: tag
        run: |
          version=$(node -p "require('./web/package.json').version")
          last=$(git tag --list "${version}-r*" | sed "s/^${version}-r//" | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          echo "tag=${version}-r${n}" >> "$GITHUB_OUTPUT"

      - name: Create git tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          {
            echo "tags<<EOF"
            echo "${image}:${{ steps.tag.outputs.tag }}"
            echo "${image}:latest"
            echo "${image}:${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: web
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
