name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: polyqr
          POSTGRES_PASSWORD: polyqr
          POSTGRES_DB: polyqr_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U polyqr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://polyqr:polyqr@localhost:55432/polyqr_test
      DATABASE_URL_TEST: postgres://polyqr:polyqr@localhost:55432/polyqr_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          HELLOASSO_WEBHOOK_SECRET: ${{ secrets.HELLOASSO_WEBHOOK_SECRET }}
          HELLOASSO_CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}
          HELLOASSO_API_BASE_URL: ${{ vars.HELLOASSO_API_BASE_URL }}
          HELLOASSO_CLIENT_ID: ${{ vars.HELLOASSO_CLIENT_ID }}
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
