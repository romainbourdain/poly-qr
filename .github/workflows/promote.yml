name: Promote

# Lancement manuel : donne aux images d'un build `<version>-r<N>` le tag stable
# `<version>` (sans rebuild), par exemple 0.1.2-r3 -> 0.1.2.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de build à promouvoir (ex. 0.1.2-r3)"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      packages: write # ajout d'un tag sur les images GHCR
    steps:
      - name: Version stable
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-r[0-9]+$ ]]; then
            echo "Tag invalide : $TAG (attendu : <version>-r<N>, ex. 0.1.2-r3)" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag des images
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          for suffix in "" "-migrate"; do
            docker buildx imagetools create \
              --tag "${image}${suffix}:${VERSION}" \
              "${image}${suffix}:${TAG}"
          done
